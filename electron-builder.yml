appId: com.rubickguo.abilitydraftplus.cn
productName: "Ability Draft Plus CN Beta"
copyright: "Copyright (c) 2026 Tiarin Hino"
directories:
  buildResources: build
  output: dist
files:
  - "out/**/*"
  - "!out/**/*.map"
extraResources:
  - from: "resources/dota_ad_data.db"
    to: "dota_ad_data.db"
  - from: "resources/data"
    to: "data"
    filter:
      - "**/*"
  - from: "resources/model"
    to: "model"
    filter:
      - "**/*"
  - from: "resources/config"
    to: "config"
    filter:
      - "**/*"
  - from: "resources/app-config.json"
    to: "app-config.json"
asar: true
asarUnpack:
  - "**/node_modules/sharp/**"
  - "**/node_modules/onnxruntime-node/**"
win:
  icon: "build/icon.ico"
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  artifactName: "Ability-Draft-Plus-CN-Beta-Setup-${version}.${ext}"
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
portable:
  artifactName: "Ability-Draft-Plus-CN-Beta-Portable-${version}.${ext}"
publish:
  provider: github
  owner: rubickguo
  repo: ability-draft-plus
  channel: beta
  releaseType: prerelease
