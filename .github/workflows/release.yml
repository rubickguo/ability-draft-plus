name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Beta tag to build and publish
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build:public
      - run: npm run test:e2e
      - run: npx electron-builder --win --publish=never
      - run: node scripts/verify-public-beta.mjs
      - run: node scripts/write-release-checksums.mjs
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --prerelease --generate-notes
          }
          $artifacts = Get-ChildItem dist -File | Where-Object { ($_.Name -like 'Ability-Draft-Plus-CN-Beta-*' -and $_.Extension -in '.exe', '.blockmap') -or $_.Name -in 'beta.yml', 'SHA256SUMS.txt' } | ForEach-Object FullName
          gh release upload $env:RELEASE_TAG @artifacts --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
