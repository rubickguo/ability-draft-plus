name: CI
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build:public
      - run: npm run test:e2e
      - run: npx electron-builder --win --publish=never
      - name: Verify packaged public build
        run: node scripts/verify-public-beta.mjs
      - run: node scripts/write-release-checksums.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: windows-beta
          path: |
            dist/Ability-Draft-Plus-CN-Beta-*.exe
            dist/Ability-Draft-Plus-CN-Beta-*.blockmap
            dist/beta.yml
            dist/SHA256SUMS.txt
          retention-days: 14
